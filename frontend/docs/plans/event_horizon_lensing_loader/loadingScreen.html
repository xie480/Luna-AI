<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luna AI - Event Horizon Loading Screen</title>
  <link rel="stylesheet" href="./EventHorizonLoader.module.css" />
  <!-- 引入 React 与 ReactDOM（兼容 ES 模块） -->
  <script
    crossorigin
    src="https://esm.sh/react@18.2.0?dev"
  ></script>
  <script
    crossorigin
    src="https://esm.sh/react-dom@18.2.0/client?dev"
  ></script>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    // 注意：此示例仅用于演示，实际项目建议通过 Vite/Webpack 打包并在 src/renderer 中使用组件。
    import { EventHorizonLoader } from "./EventHorizonLoader.tsx";
    const { createRoot } = ReactDOM;
    const root = createRoot(document.getElementById('root'));
    root.render(React.createElement(EventHorizonLoader));
  </script>
</body>
</html>
