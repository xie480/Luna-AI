syntax = "proto3";

// 通信模块的协议定义
// 本文件定义 Luna AI 各层之间（Go Runtime <-> Python AI Service）的 gRPC 通信协议
package communication;
option go_package = "luna-ai/backend/runtime/shared/proto";

// Ping 请求消息
message PingRequest {
  // 跟踪ID，用于请求追踪
  string trace_id = 1;
  // 时间戳，记录请求发起的时间
  int64 timestamp = 2;
}

// Pong 响应消息
message PongResponse {
  // 跟踪ID，用于请求追踪
  string trace_id = 1;
  // 时间戳，记录响应返回的时间
  int64 timestamp = 2;
  // 源信息，表示响应来源
  string source = 3;
}

// ChatMessage 定义单条对话消息，用于多轮对话历史记录
message ChatMessage {
  // 角色：system / user / assistant
  string role = 1;
  // 消息文本内容
  string content = 2;
  // 是否为错误消息
  bool is_error = 3;
  // 错误详情
  string error_details = 4;
}

// Chat 请求消息
message ChatRequest {
  // 跟踪ID，用于请求追踪
  string trace_id = 1;
  // 用户输入的消息内容
  string message = 2;
  // 多轮对话历史记录列表，不包含当前 message
  // 前端维护的历史记录，按时间正序排列（最旧的在最前）
  repeated ChatMessage history = 3;
  // 完整的系统提示词（包含 personality、memory、runtime 等所有上下文层）
  string system_prompt = 4;
}

// SummarizeContext 请求消息
message SummarizeContextRequest {
  // 跟踪ID，用于请求追踪
  string trace_id = 1;
  // 已渲染好的完整摘要压缩提示词
  string summarize_prompt = 2;
}

// SummarizeContext 响应消息
message SummarizeContextResponse {
  // 跟踪ID，用于请求追踪
  string trace_id = 1;
  // 新的 core_summary
  string new_core_summary = 2;
  // 新的 key_facts
  string new_key_facts = 3;
  // 新的 short_term_memory
  string new_short_term_memory = 4;
}

// Chat 流式响应消息
message ChatStreamResponse {
  // 跟踪ID，用于请求追踪
  string trace_id = 1;
  // 消息类型："thought_content"（内心独白）/"emotion_update"（情绪更新）/"reply_chunk"（回复文本片段）
  string type = 2;
  // 文本块内容（情绪枚举值 / 内心独白文本 / 经过缓冲合并后的短语/短句）
  string chunk = 3;
  // 是否结束
  bool is_finished = 4;
  // 结束原因 (stop / length / error)
  string finish_reason = 5;
  // 错误信息，仅当 finish_reason = "error" 时非空
  string error = 6;
}

message ModelConfig {
  string base_url = 1;
  string api_key = 2; // 明文，仅在内存中流转
  string model_id = 3;
  int32 max_tokens = 4; // 0 表示无上限
  float temperature = 5;
}

// 预设配置同步请求
message SyncPresetConfigRequest {
  string schema_version = 1; // 必须包含版本号，例如 "v1.0"
  string preset_id = 2;
  ModelConfig large_model = 3;
  ModelConfig medium_model = 4;
  ModelConfig small_model = 5;
}

// 预设配置同步响应
message SyncPresetConfigResponse {
  bool success = 1;
  string error_message = 2;
}

// 历史记录压缩请求
message CompressHistoryRequest {
  string session_id = 1;
  string session_context = 2; // 结合了 summary 和 history 的完整上下文
}

// 历史记录压缩响应
message CompressHistoryResponse {
  string summary = 1; // 深度压缩后的会话摘要
}

// Embedding 请求消息
// 做什么：请求对文本进行向量化（Embedding），生成语义向量
// 为什么这样做：将自然语言文本转换为稠密向量，用于语义检索与相似度计算
// 输入：text（要向量化的文本内容）
// 边界条件：text 为空时返回 success=false
message EmbeddingRequest {
  // 要向量化的文本内容
  string text = 1;
}

// Embedding 响应消息
// 输出：
//   - vector_json: JSON 序列化的 float64 向量数组
//   - success: 是否成功
//   - error_message: 错误信息（成功时为空）
message EmbeddingResponse {
  // JSON 序列化的 float64 向量数组，例如 "[0.123, 0.456, ...]"
  string vector_json = 1;
  // 是否成功
  bool success = 2;
  // 错误信息（成功时为空字符串）
  string error_message = 3;
}

// Rerank 请求消息
// 做什么：对查询（query）与候选文档列表（documents）进行相关性重排打分
// 为什么这样做：在检索到候选记忆片段后，通过 CrossEncoder 进行精确的相关性排序，
//              提升最终结果的质量
// 输入：
//   - query: 查询文本（用户意图）
//   - documents: 候选文档列表（待排序的记忆片段）
// 边界条件：
//   - query 为空时返回 success=false
//   - documents 为空时返回空 scores 列表
message RerankRequest {
  // 查询文本（用户意图）
  string query = 1;
  // 候选文档列表（待排序的记忆片段）
  repeated string documents = 2;
}

// Rerank 响应消息
// 输出：
//   - scores: 每个 document 对应的相关性分数（与 documents 顺序一一对应）
//   - success: 是否成功
//   - error_message: 错误信息（成功时为空）
message RerankResponse {
  // 每个 document 对应的相关性分数，与输入 documents 顺序一一对应
  repeated double scores = 1;
  // 是否成功
  bool success = 2;
  // 错误信息（成功时为空字符串）
  string error_message = 3;
}

// 通信服务定义
service CommunicationService {
  // Ping 方法，用于健康检查和连接测试
  rpc Ping(PingRequest) returns (PongResponse);
  
  // ChatStream 方法，用于流式对话
  rpc ChatStream(ChatRequest) returns (stream ChatStreamResponse);

  // SummarizeContext 方法，用于后台摘要压缩
  rpc SummarizeContext(SummarizeContextRequest) returns (SummarizeContextResponse);

  rpc SyncPresetConfig(SyncPresetConfigRequest) returns (SyncPresetConfigResponse);

  // CompressHistory 方法，用于历史记录压缩
  rpc CompressHistory(CompressHistoryRequest) returns (CompressHistoryResponse);

  // Embedding 方法，用于文本向量化
  // 做什么：接收文本，返回对应的语义向量（稠密 Embedding）
  // 为什么这样做：将自然语言文本转换为向量，用于 Qdrant 语义检索
  rpc Embedding(EmbeddingRequest) returns (EmbeddingResponse);

  // Rerank 方法，用于候选文档重排打分
  // 做什么：接收查询和候选文档列表，返回每个文档的相关性分数
  // 为什么这样做：在向量检索后，通过 CrossEncoder 精排提升召回质量
  rpc Rerank(RerankRequest) returns (RerankResponse);
}
