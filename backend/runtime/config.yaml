# Luna 运行时配置文件
# 所有配置项均可通过环境变量覆盖

server:
  # HTTP 服务器监听端口
  port: 8080

log:
  # 日志级别: debug, info, warn, error
  level: "info"

ai_service:
  # Python AI 服务 gRPC 地址
  address: "localhost:50051"

# Redis 配置 - 用于 DAG 工作流状态同步与 Event Bus
redis:
  # Redis 服务器地址
  host: "localhost"
  # Redis 服务器端口
  port: 6379
  # Redis 密码（本地开发通常为空）
  password: ""
  # Redis 数据库编号
  db: 0

# PostgreSQL 配置 - 用于配置、记忆、状态持久化
postgres:
  # PostgreSQL 服务器地址
  host: "localhost"
  # PostgreSQL 服务器端口
  port: 5432
  # PostgreSQL 用户名
  user: "postgres"
  # PostgreSQL 密码
  password: "postgres"
  # PostgreSQL 数据库名
  database: "luna"

# Qdrant 配置 - 用于长期记忆向量检索
qdrant:
  # Qdrant HTTP API 地址
  address: "http://localhost:6333"
