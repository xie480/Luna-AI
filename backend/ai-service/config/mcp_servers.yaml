mcp_servers:
  - id: "${MCP_SERVER_ID:-smithery_main}"
    name: "${MCP_SERVER_NAME:-Smithery Toolbox}"
    endpoint_url: "${MCP_SERVER_ENDPOINT_URL:-https://mcp.smithery.run/yilena05050}"
    transport_type: "${MCP_SERVER_TRANSPORT_TYPE:-sse}"
    auth:
      type: "${MCP_SERVER_AUTH_TYPE:-service_token}"
      token_env: "${MCP_SERVER_AUTH_TOKEN_ENV:-SMITHERY_SERVICE_TOKEN}" # 指向 .env 中的变量
    sync_interval_seconds: ${MCP_SERVER_SYNC_INTERVAL:-3600}
    timeout_seconds: ${MCP_SERVER_TIMEOUT_SECONDS:-30}
    allow_tools: ["*"]
    deny_tools: []
