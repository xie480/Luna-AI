mcp_servers:
  - id: "${MCP_SERVER_ID:-smithery_1}"
    name: "${MCP_SERVER_NAME:-YilenaServer}"
    endpoint_url: "${MCP_SERVER_ENDPOINT_URL:-https://mcp.smithery.run/1}"
    transport_type: "${MCP_SERVER_TRANSPORT_TYPE:-http}" # 支持 http, sse
    auth:
      type: "${MCP_SERVER_AUTH_TYPE:-service_token}"
      token_env: "${MCP_SERVER_AUTH_TOKEN_ENV:-SMITHERY_SERVICE_TOKEN}" # 指向 .env 中的变量
    namespace: "${MCP_SERVER_NAMESPACE:-luna-agent}"
    defer_loading: ${MCP_SERVER_DEFER_LOADING:-true} # 是否开启延迟加载，防止初始提示词过长
    sync_interval_seconds: ${MCP_SERVER_SYNC_INTERVAL:-3600} # 自动同步发现的时间间隔
    timeout_seconds: ${MCP_SERVER_TIMEOUT_SECONDS:-30}
    circuit_breaker:
      failure_threshold: ${MCP_SERVER_CB_FAILURE_THRESHOLD:-0.5}
      recovery_timeout: ${MCP_SERVER_CB_RECOVERY_TIMEOUT:-60}
      min_request_count: ${MCP_SERVER_CB_MIN_REQUEST_COUNT:-5}
    allow_tools: ["*"] # 白名单模式，* 代表全部允许
    deny_tools: [] # 黑名单机制
