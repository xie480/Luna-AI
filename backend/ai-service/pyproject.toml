[project]
name = "luna-ai-service"
version = "0.1.0"
description = "Luna AI Service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "openai>=1.14.0",
    "tenacity>=8.2.3",
    "sentence-transformers>=3.0.0",
    "qdrant-client>=1.8.0",
    "tiktoken>=0.7.0",
    "trafilatura>=1.9.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "chardet>=5.2.0",
    # --- Phase 12 新增：MCP 工具模块依赖 ---
    "jsonschema>=4.20.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true